<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      padding: 30px 25px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d9d9d9;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus {
      border-color: #4a90e2;
    }

    button {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: #4a90e2;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #3c7fd5;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      font-size: 14px;
    }

    .message.success {
      background: #eafaf1;
      color: #1f8f52;
      border: 1px solid #b7e4c7;
      display: block;
    }

    .message.error {
      background: #fdecec;
      color: #c0392b;
      border: 1px solid #f5b7b1;
      display: block;
    }

    .small-text {
      text-align: center;
      margin-top: 15px;
      color: #666;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login</h2>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="user@example.com" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          required
        />
      </div>

      <button type="submit">Login</button>
    </form>

    <div id="responseMessage" class="message"></div>

    <div class="small-text">
      Password must contain:
      <br />
      8+ chars, uppercase, lowercase, number, special character
    </div>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const responseMessage = document.getElementById("responseMessage");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      // Client-side validation for quick feedback
      const emailPattern = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
      const passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

      if (!emailPattern.test(email)) {
        showMessage("Please enter a valid email address.", "error");
        return;
      }

      if (!passwordPattern.test(password)) {
        showMessage(
          "Password must be at least 8 characters, include uppercase, lowercase, number, and special character.",
          "error"
        );
        return;
      }

      try {
        const response = await fetch("http://localhost:8080/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email: email,
            password: password
          })
        });

        const data = await response.json();

        if (response.ok) {
          showMessage("Login successful!", "success");
          console.log(data);
        } else {
          const errors = data.errors || [data.message || "Login failed"];
          showMessage(errors.join(", "), "error");
        }
      } catch (error) {
        showMessage("Unable to connect to the API. Please check if the backend is running.", "error");
        console.error(error);
      }
    });

    function showMessage(message, type) {
      responseMessage.textContent = message;
      responseMessage.className = "message " + type;
    }
  </script>
</body>
</html>
